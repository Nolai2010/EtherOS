# EtherOS CI(M0 阶段:脚手架一致性门禁;M5 扩展为六项全验,见 spec §5)
name: ci

on:
  push:
  pull_request:

jobs:
  etherkit-consistency:
    name: etherkit single-source consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate tool configs from .etherkit/
        run: bash .etherkit/generate.sh

      - name: Fail on drift (generated files must be committed & in sync)
        run: |
          if ! git diff --exit-code; then
            echo "::error::.etherkit/ 与生成物不同步:请修改 .etherkit/ 源文件后运行 bash .etherkit/generate.sh,并把源与生成物一并提交(禁止手改生成物)。"
            exit 1
          fi

      - name: Doc index consistency (docs/index.md must exist)
        run: test -f docs/index.md

      - name: Slogan guard (forbidden slogan must not appear)
        run: |
          # 禁用口号守卫:裸用拦截;警示性提及(含 禁用/严禁/不使用/DeepSeek/占用 字样)豁免。
          # 目录豁免: .etherkit(规则源)/spec(方针记录)/experience-library(教训记录)。
          hits=$(grep -rn "一切皆插件" --include="*.md" \
                   --exclude-dir=.etherkit --exclude-dir=spec --exclude-dir=experience-library . \
                 | grep -vE "禁用|严禁|不使用|DeepSeek|占用" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::检测到禁用口号裸用(DeepSeek Harness 已占用)。请使用「融汇万端 / Connect the Unconnectable.」;警示性提及须带 禁用/严禁/不使用 等字样。"
            exit 1
          fi

      - name: M0 empty build (skeleton check)
        run: make check

      - name: "Kernel boundary guard (M4: vendored pin + kernel whitelist + format literals)"
        # 仓库卫生门扩展(计划 M4-T5):vendored 指针一致 + kernel/ 白名单 + 格式字面量零命中
        # + manifest 契约对齐。本 job checkout 为非递归(submodule 未初始化),守卫对 vendored
        # 指针的检查走 git ls-tree HEAD(读 gitlink SHA),不受影响;仅"submodule 已初始化才
        # 可做"的本地漂移子检查会打印 SKIP 明示跳过(非静默),其余检查照常执行,不许静默跳过。
        run: python3 tools/check_kernel_boundary.py

  plugin-schema:
    name: plugin manifest schema & config consistency (M2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests against schema v2
        run: |
          python3 -m pip install --quiet jsonschema
          python3 tools/validate_plugins.py

      - name: Protocol routing smoke (M3 route_plugins)
        run: |
          python3 tools/route_plugins.py --protocol ipa
          ! python3 tools/route_plugins.py --protocol no-such-proto
          python3 tools/route_plugins.py --run hello-plugin
          python3 tools/route_plugins.py --run douyin

      - name: Load plan smoke (M7 load_plugins)
        run: |
          python3 tools/load_plugins.py | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='plan-only'; print('LOAD PLAN OK', len(d['enabled']))"
          printf '[plugins]\nenabled = ["no-such-plugin"]\n' > /tmp/bogus.toml
          ! python3 tools/load_plugins.py --config /tmp/bogus.toml

      - name: Dependency topology smoke (M9 load_plugins dependencies)
        # M9-04:schema v2 起 manifest 支持可选 dependencies,load_order 由依赖拓扑决定
        # (被依赖者在前),依赖成环 → 非 0 退出并列出环上成员(约束 41:不静默、不降级 warn)。
        # 夹具树建在 /tmp(仓库内不新增文件):正例 alpha 依赖 beta(目录序 alpha<beta<gamma,
        # 断言 beta 下标 < alpha 下标,非只 echo);负例 a↔b 互赖成环(断言非 0 退出)。
        # --config 指向空 enabled 的夹具配置:仓库 config/default.toml 启用的 hello-plugin/
        # douyin 不在夹具树里,会先撞 §5-1 ENOENT 而掩盖本条断言。
        run: |
          mkdir -p /tmp/m9-dep/builtin/alpha /tmp/m9-dep/builtin/beta /tmp/m9-dep/builtin/gamma
          mkdir -p /tmp/m9-cycle/builtin/a /tmp/m9-cycle/builtin/b
          for d in /tmp/m9-dep/builtin/*/ /tmp/m9-cycle/builtin/*/; do : > "$d/payload.bin"; done
          printf '[plugins]\nenabled = []\n' > /tmp/m9-empty.toml
          cat > /tmp/m9-dep/builtin/alpha/plugin.json <<'JSON'
          {"schema_version": "2", "name": "alpha", "version": "0.1.0", "type": "native", "uninstallable": false,
           "payload": "payload.bin", "container": {"desktop": "windowed"}, "dependencies": ["beta"]}
          JSON
          cat > /tmp/m9-dep/builtin/beta/plugin.json <<'JSON'
          {"schema_version": "2", "name": "beta", "version": "0.1.0", "type": "native", "uninstallable": false,
           "payload": "payload.bin", "container": {"desktop": "windowed"}}
          JSON
          cat > /tmp/m9-dep/builtin/gamma/plugin.json <<'JSON'
          {"schema_version": "2", "name": "gamma", "version": "0.1.0", "type": "native", "uninstallable": false,
           "payload": "payload.bin", "container": {"desktop": "windowed"}}
          JSON
          cat > /tmp/m9-cycle/builtin/a/plugin.json <<'JSON'
          {"schema_version": "2", "name": "a", "version": "0.1.0", "type": "native", "uninstallable": false,
           "payload": "payload.bin", "container": {"desktop": "windowed"}, "dependencies": ["b"]}
          JSON
          cat > /tmp/m9-cycle/builtin/b/plugin.json <<'JSON'
          {"schema_version": "2", "name": "b", "version": "0.1.0", "type": "native", "uninstallable": false,
           "payload": "payload.bin", "container": {"desktop": "windowed"}, "dependencies": ["a"]}
          JSON
          python3 tools/load_plugins.py --plugins-root /tmp/m9-dep --config /tmp/m9-empty.toml | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          o = d['load_order']
          assert o.index('beta') < o.index('alpha'), f'dependency must precede dependent: {o}'
          assert [e['id'] for e in d['enabled']] == o, 'enabled order must equal load_order'
          print('TOPO OK', o)"
          ! python3 tools/load_plugins.py --plugins-root /tmp/m9-cycle --config /tmp/m9-empty.toml

      - name: Desktop-entry translation smoke (M10 real translator)
        # M10-01/02/03/05:compat 层首次真翻译 —— 外部 .desktop 描述符 → translator 真实产出
        # manifest v2 + 包装 payload(非仅翻译计划),产物过 validate_plugins.py --file;
        # 负例三条(缺 Exec / 非法格式 / 空文件)用 `!` 反向断言,须各自非 0 退出。
        # 夹具与产物全部落在 /tmp,仓库内不新增翻译产物;translator 只按 Exec= 字符串转发,
        # 不解析/执行外部二进制(约束 47),本步骤亦不执行任何 payload。
        run: |
          mkdir -p /tmp/m10-translate /tmp/m10-neg
          python3 plugins/compat/desktop-entry/translator.py \
            --manifest plugins/optional/demo-desktop-app/plugin.json --out /tmp/m10-translate | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['status'] == 'translated', f\"expected 'translated', got {d['status']}\"
          assert d['kind'] == 'descriptor-level', d['kind']
          print('TRANSLATE OK', d['manifest'])
          "
          test -f /tmp/m10-translate/plugin.json
          test -f /tmp/m10-translate/demo-desktop-app.payload
          python3 tools/validate_plugins.py --file /tmp/m10-translate/plugin.json
          cat > /tmp/m10-neg/plugin.json <<'JSON'
          {"schema_version": "2", "name": "neg-src", "version": "0.1.0", "type": "compat-bridge", "uninstallable": true,
           "payload": "app.desktop", "container": {"desktop": "windowed"}, "protocols": ["desktop-entry"],
           "translator": "plugins/compat/desktop-entry/translator.py"}
          JSON
          printf '' > /tmp/m10-neg/empty.desktop
          printf '{\n  "not": "a desktop entry",\n  "answer": 42\n}\n' > /tmp/m10-neg/bad.desktop
          printf '[Desktop Entry]\nType=Application\nName=No Exec Demo\n' > /tmp/m10-neg/noexec.desktop
          ! python3 plugins/compat/desktop-entry/translator.py --manifest /tmp/m10-neg/plugin.json --payload /tmp/m10-neg/noexec.desktop --out /tmp/m10-neg-out
          ! python3 plugins/compat/desktop-entry/translator.py --manifest /tmp/m10-neg/plugin.json --payload /tmp/m10-neg/bad.desktop --out /tmp/m10-neg-out
          ! python3 plugins/compat/desktop-entry/translator.py --manifest /tmp/m10-neg/plugin.json --payload /tmp/m10-neg/empty.desktop --out /tmp/m10-neg-out
          ! test -e /tmp/m10-neg-out
          mkdir -p /tmp/m10-loadtree/optional/demo-desktop-app
          cp /tmp/m10-translate/plugin.json /tmp/m10-translate/demo-desktop-app.payload /tmp/m10-loadtree/optional/demo-desktop-app/
          printf '[plugins]\nenabled = ["demo-desktop-app"]\n' > /tmp/m10-loadtree.toml
          python3 tools/load_plugins.py --plugins-root /tmp/m10-loadtree --config /tmp/m10-loadtree.toml | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['load_order'] == ['demo-desktop-app'], d['load_order']
          print('TRANSLATED ARTIFACT LOADABLE OK', d['load_order'])
          "

      - name: Load-state smoke (M11 real load)
        # M11-02/03/04/05:装载闭环首次端到端 smoke —— plan(load_plugins.py,M7 一字未改)→
        # load state(load_state.py,M11 宿主侧真装载:registry + 激活 routes + isolation 派生)
        # → route 消费(route_plugins.py --load-state,M11-04 附加模式)。正例链断言:
        # status "loaded" / stage "M11-loader-load" / registry id 序列 == plan load_order /
        # routes 键集合恰为 {"ipa"}(不含 "desktop-entry" —— demo-desktop-app 未启用,承袭
        # plan skipped,约束 50)/ ipa → douyin,并实跑 --load-state 查询(exit 0 且
        # route.plugin == "douyin")与未激活协议(desktop-entry 非 0,原因含「装载状态」,
        # 区别于缺省模式的树中无 enabled 插件声明)。负例 A:plan 条目 id 篡改为树中不存在
        # 值(load_order 同步改一致,防契约 §8-7 不一致拒绝掩盖 §8-4 的 ENOENT)→ 非 0。
        # 负例 B:最小两插件夹具树(/tmp,同 M9 拓扑负例先例),两个已启用 compat-bridge 同声明
        # ipa → 装载期 EAMBIGUOUS 拒绝(约束 55:歧义提前到装载期,不静默择一);夹具 plugin.json
        # 取 schema v2 基本形态(translator 指向仓库内 stub-runtime),payload 为真实小文件。
        # 产物与夹具全落 $RUNNER_TEMP(缺省 /tmp)/tmp,仓库内零新增;本步骤不执行任何 payload。
        run: |
          RT="${RUNNER_TEMP:-/tmp}"
          python3 tools/load_plugins.py > "$RT/m11-plan.json"
          python3 tools/load_state.py --plan "$RT/m11-plan.json" --out "$RT/m11-state.json"
          python3 - "$RT/m11-plan.json" "$RT/m11-state.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          state = json.load(open(sys.argv[2], encoding="utf-8"))
          assert state["status"] == "loaded", state["status"]
          assert state["stage"] == "M11-loader-load", state["stage"]
          assert [e["id"] for e in state["registry"]] == plan["load_order"], "registry id order must equal plan load_order"
          assert state["load_order"] == plan["load_order"], "state load_order must equal plan load_order"
          assert set(state["routes"]) == {"ipa"}, f"routes must be exactly ipa: {sorted(state['routes'])}"
          assert "desktop-entry" not in state["routes"], "demo-desktop-app not loaded; desktop-entry must not be activated"
          assert state["routes"]["ipa"]["plugin"] == "douyin", state["routes"]["ipa"]
          print("LOAD STATE OK", state["load_order"], sorted(state["routes"]))
          PY
          python3 tools/route_plugins.py --load-state "$RT/m11-state.json" --protocol ipa | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['route']['plugin'] == 'douyin', d['route']
          assert d['status'] == 'routed', d['status']
          print('ROUTE VIA LOAD STATE OK', d['route']['plugin'])
          "
          if out=$(python3 tools/route_plugins.py --load-state "$RT/m11-state.json" --protocol desktop-entry 2>&1); then
            echo "::error::inactive protocol desktop-entry must exit non-zero (route via load state: ENOENT)"
            exit 1
          fi
          echo "$out" | grep -q "装载状态" || { echo "::error::inactive reason must mention 装载状态: $out"; exit 1; }
          python3 - "$RT/m11-plan.json" "$RT/m11-plan-ghost.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          ghost = "ghost-plugin-not-in-tree"
          old = plan["enabled"][0]["id"]
          plan["enabled"][0]["id"] = ghost
          plan["load_order"] = [ghost if p == old else p for p in plan["load_order"]]
          json.dump(plan, open(sys.argv[2], "w", encoding="utf-8"))
          PY
          if out=$(python3 tools/load_state.py --plan "$RT/m11-plan-ghost.json" 2>&1); then
            echo "::error::plan entry id not in tree must be rejected (load: ENOENT)"
            exit 1
          fi
          echo "$out" | grep -q "ENOENT" || { echo "::error::expected ENOENT for the ghost id: $out"; exit 1; }
          mkdir -p /tmp/m11-amb/optional/amb-a /tmp/m11-amb/optional/amb-b
          : > /tmp/m11-amb/optional/amb-a/payload.bin
          : > /tmp/m11-amb/optional/amb-b/payload.bin
          cat > /tmp/m11-amb/optional/amb-a/plugin.json <<'JSON'
          {"schema_version": "2", "name": "amb-a", "version": "0.1.0", "type": "compat-bridge", "uninstallable": true,
           "payload": "payload.bin", "container": {"desktop": "windowed"}, "protocols": ["ipa"],
           "translator": "plugins/compat/stub-runtime/translator.py"}
          JSON
          cat > /tmp/m11-amb/optional/amb-b/plugin.json <<'JSON'
          {"schema_version": "2", "name": "amb-b", "version": "0.1.0", "type": "compat-bridge", "uninstallable": true,
           "payload": "payload.bin", "container": {"desktop": "windowed"}, "protocols": ["ipa"],
           "translator": "plugins/compat/stub-runtime/translator.py"}
          JSON
          printf '[plugins]\nenabled = ["amb-a", "amb-b"]\n' > /tmp/m11-amb.toml
          python3 tools/load_plugins.py --plugins-root /tmp/m11-amb --config /tmp/m11-amb.toml > "$RT/m11-amb-plan.json"
          if out=$(python3 tools/load_state.py --plan "$RT/m11-amb-plan.json" --plugins-root /tmp/m11-amb 2>&1); then
            echo "::error::two loaded compat-bridges declaring ipa must be rejected at load time (load: EAMBIGUOUS)"
            exit 1
          fi
          echo "$out" | grep -q "EAMBIGUOUS" || { echo "::error::expected EAMBIGUOUS: $out"; exit 1; }
          echo "LOAD-STATE SMOKE OK (M11 real load + route consumption)"

  license:
    name: license (reuse lint, submodules excluded per spec 5 / risk 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Defensive assert base/toaruos stays a submodule
        run: git config -f .gitmodules --get submodule.base/toaruos.path | grep -qx "base/toaruos"
      - name: reuse lint (default excludes submodules; upstream licenses via NOTICE & docs/license-inventory.md)
        run: |
          python3 -m pip install --quiet reuse
          reuse --version
          reuse lint

  dco:
    name: dco (Signed-off-by on every commit, merges exempt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check Signed-off-by
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Use the PR event's own SHAs: actions/checkout may not create
            # refs/remotes/origin/<base>, so origin/<base_ref> is not guaranteed
            # to resolve (actions/checkout#2219). base.sha is an ancestor of the
            # fetched merge ref and is present with fetch-depth: 0.
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            COMMITS=$(git log --no-merges --format=%H "$RANGE")
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              COMMITS=$(git log --no-merges --format=%H)   # 新分支首推：全历史
            else
              COMMITS=$(git log --no-merges --format=%H "$BEFORE..${{ github.event.after }}")
            fi
          fi
          fail=0
          for sha in $COMMITS; do
            git log -1 --format=%B "$sha" | grep -q "Signed-off-by:" || { echo "::error::commit $sha missing Signed-off-by"; fail=1; }
          done
          echo "checked $(printf '%s\n' "$COMMITS" | grep -c '[0-9a-f]') non-merge commit(s)"
          exit $fail

  lint:
    # 只扫 EtherOS 自有代码:find 起点限定 kernel/ tools/ plugins/,
    # base/(上游 toaruos) 结构性排除,绝不扫上游。
    # clang-tidy 省略(需 compile db,内核非本仓构建);python 只到 pyflakes 级别。
    name: lint (EtherOS-owned code only; base/ structurally excluded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format cppcheck && python3 -m pip install --quiet pyflakes
      - name: clang-format (C under kernel/ tools/ plugins/ only)
        # M7-3 空集断言:旧写法 `find … | xargs -r …` 在目标集为空时 xargs 不执行
        # 任何东西、退出 0 —— 门禁静默通过(kernel/ tools/ plugins/ 被改名或清空
        # 也不会红)。改为先收集列表并断言非空,再把列表喂给工具。
        # 未放宽 --Werror;find 起点仍严格限定 kernel tools plugins(结构性排除 base/)。
        run: |
          FILES=$(find kernel tools plugins \( -name '*.c' -o -name '*.h' \) -type f)
          test -n "$FILES" || { echo "::error::no C/H files found under kernel/ tools/ plugins/"; exit 1; }
          printf '%s\n' "$FILES" | xargs clang-format --dry-run --Werror
      - name: cppcheck (kernel/)
        # 目录形式实证失效(run 38069483688):"could not find or open any of the
        # paths given." —— kernel/ 下只有 .h,cppcheck 扫目录时找不到可检文件,
        # 属"找不到文件"而非真实告警,故改用显式文件列表(风险 A 预裁定)。
        # 未放宽 --error-exitcode,未加 --suppress 掩盖真实告警。
        # M7-3 空集断言:同上,目标集为空必须先红而非静默通过。
        run: |
          FILES=$(find kernel \( -name '*.c' -o -name '*.h' \) -type f)
          test -n "$FILES" || { echo "::error::no C/H files found under kernel/"; exit 1; }
          printf '%s\n' "$FILES" | xargs -d '\n' cppcheck --language=c --enable=warning --error-exitcode=1
      - name: pyflakes (python tools)
        # M10-6 关门(F7③):目标由 stub-runtime 单目录扩为 plugins/compat/*/*.py,
        # 覆盖 M10 新增的 compat/desktop-entry/translator.py(本地已验 pyflakes 干净);
        # 方向只许更严,不是放宽。
        run: python3 -m pyflakes tools/*.py plugins/compat/*/*.py

  spec-consistency:
    # 分工:etherkit-consistency 管生成物漂移/slogan/make check/index 存在性(test -f);
    # 本 job 管 index 每条被引文档的真实悬空 + spec 锚点 + schema 版本锚点。两者无重复门禁。
    name: spec & docs reference consistency (anti context-drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/index.md dangling check + spec anchor checks
        run: |
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          root = Path(".").resolve()
          docs = root / "docs"
          fails = []
          # (a) index dangling check: try docs/-relative then repo-root-relative.
          # Backticked snippets containing whitespace are command lines, not paths.
          # M5 裁定 1(保留,不可删):含空白字符的反引号片段按命令行跳过,否则
          # index.md 里的 `python3 tools/validate_plugins.py` 会被当成路径而假红。
          text = (docs / "index.md").read_text(encoding="utf-8")
          scanned = 0
          candidates = 0
          for p in sorted(set(re.findall(r'`([^`]+?\.(?:md|py|json|toml|sh))`', text))):
            scanned += 1
            if any(ch.isspace() for ch in p):
              continue
            candidates += 1
            cand = p[2:] if p.startswith("./") else p
            if not (docs / cand).exists() and not (root / cand).exists():
              fails.append(f"docs/index.md references missing doc: {p}")
          # M7-01 空候选集不再静默通过:0 个候选意味着正则失效或 index.md 被清空,
          # 旧写法下 0 次循环直接 OK(静默通过)。此处必须 FAIL。
          if candidates < 1:
            fails.append(f"docs/index.md yielded 0 path candidates ({scanned} backticked snippet(s) scanned); regex or index content broke")
          # (b) acceptance-standard milestone sections present
          # M7-01 行首锚定:旧写法 f"## {m}" not in std 是子串匹配,文档里的
          # `## M1+ · 占位` 会让真正的 `## M1` 章节被删也放行(门禁形同虚设)。
          # 定稿形式:整行等于 `## {m}`,或以 `## {m} ` (结尾带空格)开头。
          # 于是 `## M1+ · 占位` 二者皆不满足(不再掩盖真 M1 的缺失),
          # 而 `## M1 · 底座基线(归档...)` 满足后者,仍被认可。
          std_lines = (docs / "development" / "acceptance-standard.md").read_text(encoding="utf-8").splitlines()
          # M7-01 白名单扩到 M7:旧元组停在 M5,M6/M7 两个已入库章节不受本道门禁
          # 保护(删了也不红)。二者当前确实存在于 acceptance-standard.md,扩了是
          # 门禁增强、不会假红。方向只许更严。
          # M9-3 再扩到 M9:M8 之后 M9 章节亦已入库,同理扩了是门禁增强、不会假红。
          # M10-6 再扩到 M10:M10 章节已入库(acceptance-standard.md:130),同理扩了是
          # 门禁增强、不会假红。方向只许更严。
          # M11-8 再扩到 M11(清偿审查 Minor 2):M11 章节已入库,同理;每里程碑扩一次。
          for m in ("M0", "M1", "M2", "M3", "M4", "M5", "M6", "M7", "M8", "M9", "M10", "M11"):
            if not any(line == f"## {m}" or line.startswith(f"## {m} ") for line in std_lines):
              fails.append(f"acceptance-standard.md missing section: {m}")
          # (c) spec anchor referenced by .etherkit/AGENTS.md
          agents = (root / ".etherkit" / "AGENTS.md").read_text(encoding="utf-8")
          for ref in set(re.findall(r'`(spec/[0-9A-Za-z._-]+\.md)`', agents)):
            if not (root / ref).exists():
              fails.append(f".etherkit/AGENTS.md references missing spec: {ref}")
          # (d) schema version anchor
          # M9 同步说明(M9-06):schema v1 → v2 是 spec §2.4「字段变更 = schema_version 变更」的
          # 真实升级,锚点随契约版本从 "1" 改为 "2"。这是**同步**而非消音 —— 断言本身
          # (const 必须等于当前契约版本)与严格度一字未变,改的只是"当前版本"这个事实;
          # 若 schema 被改回 "1" 或漂移到 "3",本条依旧红。
          schema = json.loads((root / "plugins" / "schema" / "plugin.schema.json").read_text(encoding="utf-8"))
          if schema.get("properties", {}).get("schema_version", {}).get("const") != "2":
            fails.append("plugin.schema.json schema_version anchor drifted from \"2\"")
          if fails:
            print("\n".join(fails)); sys.exit(1)
          print("spec consistency: OK")
          PY

  build:
    # 上游官方构建路径:toaruos/build-tools 镜像自带预构建工具链 /root/gcc_local,
    # 由 util/build-in-docker.sh 链接后执行 make(见 docs/reports/2026-10-06-toaruos-survey.md)。
    # 裸 runner 自举工具链在 round 3 实证不可行(libgcc_s.so.1 链出失败被吞,模式规则断链)。
    # 改本配方必须同步 release.yml:build-release(同镜像 + util/build-in-docker.sh),M6-01 注释互指。
    name: build ToaruOS base (upstream builder image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build base OS (upstream builder image, per docs/reports/2026-10-06-toaruos-survey.md)
        run: |
          docker pull toaruos/build-tools:1.99.x
          docker run -v ${{ github.workspace }}/base/toaruos:/root/misaka -w /root/misaka -e LANG=C.UTF-8 -t toaruos/build-tools:1.99.x util/build-in-docker.sh

      - name: Collect boot artifacts
        run: |
          mkdir -p artifacts
          find base/toaruos -maxdepth 2 -type f \( -name "*.iso" -o -name "misaka-kernel" -o -name "*.igz" \) -exec cp {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etheros-boot-artifacts
          path: artifacts/
          if-no-files-found: warn

  vm-smoke:
    # T11:QEMU headless 启动取证。跑法忠实于上游 build/x86_64.mk 的 shell 目标:
    # fw_cfg bootmode=headless 让 bootloader 跳过菜单并以 start=--headless 启动,
    # base/etc/startup.d/99_runstart.sh 据此执行 /bin/getty ${GETTY_ARGS},
    # gettyargs 经 fw_cfg 注入(指向 ttyS1 = 第二个 -serial)。apps/login.c:86
    # 会向串口打印 "<hostname> login: ",hostname 为 base/etc/hostname 的 "livecd"。
    # 断言文本 "login:" 系从上游源码核实,非想象字符串。
    name: vm smoke (QEMU headless boot evidence)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: etheros-boot-artifacts
          path: artifacts

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Boot image headless and capture serial log
        run: |
          ls -la artifacts/
          ISO=$(find artifacts -name "*.iso" | head -1)
          test -n "$ISO" || { echo "NO ISO ARTIFACT"; exit 1; }
          qemu-system-x86_64 --version
          rm -f serial-com1.log serial-com2.log screen.ppm
          # COM1(0x3F8)接 early log 文件;COM2(ttyS1)接 getty。VGA 保留设备但
          # -display none 不渲染(bootloader/fbterm 需要 VGA,勿加 -vga none)。
          qemu-system-x86_64 \
            -M q35 -m 512 -smp 2 -no-reboot \
            -cdrom "$ISO" -boot d \
            -display none -nic none \
            -serial file:serial-com1.log \
            -serial file:serial-com2.log \
            -fw_cfg name=opt/org.toaruos.bootmode,string=headless \
            -fw_cfg "name=opt/org.toaruos.gettyargs,string=/dev/ttyS1 115200 xterm" \
            -qmp unix:/tmp/qmp.sock,server,nowait \
            &
          QEMU_PID=$!
          # ubuntu-latest 无 KVM,TCG 启动慢:每 5s 轮询串口,至多 ~120s,拿到即提前收
          EVIDENCE=""
          for i in $(seq 1 24); do
            sleep 5
            if grep -aq "login:" serial-com2.log 2>/dev/null; then EVIDENCE=yes; break; fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then echo "qemu exited early (round $i)"; break; fi
          done
          echo "poll rounds: $i, evidence: ${EVIDENCE:-none}"
          # 辅助证据:QMP screendump(fbterm 内核控制台),尽力而为,失败不阻塞
          cat > /tmp/qmp_dump.py <<'PYEOF'
          import socket
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect("/tmp/qmp.sock")
          f = s.makefile("rwb")
          f.readline()
          f.write(b'{"execute":"qmp_capabilities"}\n'); f.flush()
          f.readline()
          f.write(b'{"execute":"screendump","arguments":{"filename":"screen.ppm"}}\n'); f.flush()
          f.readline()
          f.close(); s.close()
          PYEOF
          python3 /tmp/qmp_dump.py || true
          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true
          echo "---- serial-com1.log (COM1 early log, head 100) ----"
          head -100 serial-com1.log 2>/dev/null | cat -v || true
          echo "---- serial-com2.log (COM2 getty/login, head 100) ----"
          head -100 serial-com2.log 2>/dev/null | cat -v || true
          ls -la serial-com1.log serial-com2.log screen.ppm 2>/dev/null || true

      - name: Assert boot evidence (honest)
        run: |
          test -f serial-com2.log || { echo "NO SERIAL LOG"; exit 1; }
          # 真实断言:login 启动后必打印 "<hostname> login: "(apps/login.c:86),
          # 出现即证明内核与用户态均已真正跑起来(ramdisk/驱动/init 全链路)。
          if grep -aq "login:" serial-com2.log; then
            echo "BOOT EVIDENCE OK: userspace login reached on serial (COM2)"
            exit 0
          fi
          echo "NO BOOT EVIDENCE IN SERIAL"
          echo "---- serial-com2.log (full) ----"
          cat -v serial-com2.log || true
          exit 1

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-smoke-evidence
          path: |
            serial-com1.log
            serial-com2.log
            screen.ppm
          if-no-files-found: warn

  build-aarch64:
    # 上游官方 aarch64 构建路径,与 build job(x86_64)同源、仅两处不同:
    # 镜像 toaruos/build-tools:1.99.x -> toaruos/build-tools:aarch64,
    # 入口 util/build-in-docker.sh -> util/build-in-docker-aarch64.sh
    # (内部 make ARCH=aarch64;system 目标产出 misaka-kernel/ramdisk.igz/
    # bootstub/kernel8.img,见 build/aarch64.mk 与上游 .github/workflows/aarch64.yml,
    # 依据 docs/reports/2026-10-11-phase2-feasibility.md 议题一)。
    name: build ToaruOS aarch64 base (upstream builder image)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build aarch64 base OS (upstream builder image, per docs/reports/2026-10-11-phase2-feasibility.md)
        run: |
          docker pull toaruos/build-tools:aarch64
          docker run -v ${{ github.workspace }}/base/toaruos:/root/misaka -w /root/misaka -e LANG=C.UTF-8 -t toaruos/build-tools:aarch64 util/build-in-docker-aarch64.sh

      - name: Collect aarch64 boot artifacts
        run: |
          mkdir -p artifacts
          find base/toaruos -maxdepth 2 -type f \( -name "misaka-kernel" -o -name "*.igz" -o -name "bootstub" -o -name "kernel8.img" \) -exec cp {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload aarch64 boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etheros-aarch64-artifacts
          path: artifacts/
          if-no-files-found: warn

  vm-smoke-aarch64:
    # QEMU 参数以 base/toaruos/build/aarch64.mk 的 shell 目标为权威(headless 串口):
    # qemu-system-aarch64 -M virt -m 4G -smp 4 -cpu cortex-a72 -no-reboot -display none
    # -d guest_errors -net user + e1000e,-kernel bootstub,-append "root=/dev/ram0
    # migrate start=--headless",fw_cfg 注入 kernel/initrd
    # (opt/org.toaruos.kernel / opt/org.toaruos.initrd)与 gettyargs
    # (-a local /dev/ttyS0 115200,pl011)。上游 aarch64.yml 只跑 build 不跑 boot 冒烟,仅参照。
    # CI 差异(与 x86 侧 vm-smoke 同形态):-serial mon:stdio 改 -serial file: 捕获;
    # x86 runner 无 aarch64 KVM,EMU_KVM 不传(TCG);TERM 取 ${TERM:-xterm}
    # (x86 侧 gettyargs 同为 xterm;aarch64.mk 的 ${TERM} 即环境默认机制)。
    # kcmdline start=--headless → base/etc/startup.d/99_runstart.sh exec /bin/getty,
    # apps/login.c:86 打印 "<hostname> login: " —— 断言 login: 与 x86 侧同字符串同源。
    name: vm smoke aarch64 (QEMU headless boot evidence)
    runs-on: ubuntu-latest
    needs: build-aarch64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download aarch64 boot artifacts
        uses: actions/download-artifact@v4
        with:
          name: etheros-aarch64-artifacts
          path: artifacts

      - name: Install QEMU
        # ipxe-qemu:Debian/Ubuntu 的 qemu-system-arm 包不含 efi-e1000e.rom
        # (aarch64.mk EMU_ARGS 的 e1000e 需要它,round 1 实证 QEMU 秒退
        # "failed to find romfile" —— 环境缺失,非配方问题;补包不改 QEMU 参数)。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu

      - name: Boot aarch64 image headless and capture serial log
        run: |
          ls -la artifacts/
          KERNEL=$(find artifacts -name "misaka-kernel" | head -1)
          INITRD=$(find artifacts -name "*.igz" | head -1)
          BOOTSTUB=$(find artifacts -name "bootstub" | head -1)
          test -n "$KERNEL" && test -n "$INITRD" && test -n "$BOOTSTUB" || { echo "MISSING AARCH64 ARTIFACTS"; exit 1; }
          qemu-system-aarch64 --version
          rm -f serial-aarch64.log screen.ppm
          # 单串口(pl011 /dev/ttyS0)接 getty;TCG 启动慢于 x86:
          # 每 5s 轮询串口,至多 ~300s,拿到即提前收。
          # -device ramfb 出自 aarch64.mk EMU_ARGS 公共部分(run/run-vga/debug 共用):
          # shell 目标本身无显示设备,virt 默认也无 VGA;补 ramfb 让 QMP screendump
          # 有显示设备可取帧(与 x86 侧 vm-smoke 保留 VGA 供 screendump 同形态),
          # headless 启动链路不受影响(start=--headless 不启 GUI)。
          # gettyargs 与 aarch64.mk shell 目标的差异(round 3 实证后裁定):
          # 上游 shell 目标用 "-a local ..."(getty -a local → login -f local,
          # apps/login.c:66 goto do_fork 免密直登,不打印 apps/login.c:86 的
          # "login: ";serial 实况见 run 39039782092:全链路在跑、止于
          # local@livecd:~$,但无 login: 字符串)。M8-02 要求断言 login:
          # (与 x86 侧 vm-smoke 同字符串同源),故去掉 -a local 前缀,其余保持
          # 上游格式(/dev/ttyS0 115200 xterm;波特率与 term 均出自 aarch64.mk,
          # 设备节点为 pl011 首串口,与 x86 侧 /dev/ttyS1 115200 xterm 同构)。
          # 注意:bash 续行块中间不得插 # 注释(round 4 实证:注释截断 QEMU 参数,
          # QEMU 残缺前台运行致 job 20min 超时),注释只许放命令块之前。
          qemu-system-aarch64 \
            -M virt -m 4G -smp 4 -cpu cortex-a72 \
            -no-reboot -display none -d guest_errors -device ramfb \
            -net user -netdev hubport,id=u1,hubid=0, -device e1000e,netdev=u1 \
            -name "ToaruOS aarch64" \
            -kernel "$BOOTSTUB" \
            -append "root=/dev/ram0 migrate start=--headless" \
            -fw_cfg name=opt/org.toaruos.initrd,file="$INITRD" \
            -fw_cfg name=opt/org.toaruos.kernel,file="$KERNEL" \
            -fw_cfg "name=opt/org.toaruos.gettyargs,string=/dev/ttyS0 115200 ${TERM:-xterm}" \
            -serial file:serial-aarch64.log \
            -qmp unix:/tmp/qmp-aarch64.sock,server,nowait \
            &
          QEMU_PID=$!
          EVIDENCE=""
          for i in $(seq 1 60); do
            sleep 5
            if grep -aq "login:" serial-aarch64.log 2>/dev/null; then EVIDENCE=yes; break; fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then echo "qemu exited early (round $i)"; break; fi
          done
          echo "poll rounds: $i, evidence: ${EVIDENCE:-none}"
          # 辅助证据:QMP screendump,尽力而为,失败不阻塞(与 x86 侧 vm-smoke 同形态)
          cat > /tmp/qmp_dump.py <<'PYEOF'
          import socket
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.connect("/tmp/qmp-aarch64.sock")
          f = s.makefile("rwb")
          f.readline()
          f.write(b'{"execute":"qmp_capabilities"}\n'); f.flush()
          f.readline()
          f.write(b'{"execute":"screendump","arguments":{"filename":"screen.ppm"}}\n'); f.flush()
          f.readline()
          f.close(); s.close()
          PYEOF
          python3 /tmp/qmp_dump.py || true
          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true
          echo "---- serial-aarch64.log (pl011 getty/login, head 100) ----"
          head -100 serial-aarch64.log 2>/dev/null | cat -v || true
          ls -la serial-aarch64.log screen.ppm 2>/dev/null || true

      - name: Assert boot evidence (honest)
        run: |
          test -f serial-aarch64.log || { echo "NO SERIAL LOG"; exit 1; }
          # 真实断言:login 启动后必打印 "<hostname> login: "(apps/login.c:86),
          # 出现即证明 aarch64 内核与用户态均已真正跑起来(ramdisk/驱动/init 全链路)。
          if grep -aq "login:" serial-aarch64.log; then
            echo "BOOT EVIDENCE OK: userspace login reached on aarch64 serial (pl011)"
            exit 0
          fi
          echo "NO BOOT EVIDENCE IN SERIAL"
          echo "---- serial-aarch64.log (full) ----"
          cat -v serial-aarch64.log || true
          exit 1

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-smoke-aarch64-evidence
          path: |
            serial-aarch64.log
            screen.ppm
          if-no-files-found: warn
