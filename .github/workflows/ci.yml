# EtherOS CI(M0 阶段:脚手架一致性门禁;M5 扩展为六项全验,见 spec §5)
name: ci

on:
  push:
  pull_request:

jobs:
  etherkit-consistency:
    name: etherkit single-source consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate tool configs from .etherkit/
        run: bash .etherkit/generate.sh

      - name: Fail on drift (generated files must be committed & in sync)
        run: |
          if ! git diff --exit-code; then
            echo "::error::.etherkit/ 与生成物不同步:请修改 .etherkit/ 源文件后运行 bash .etherkit/generate.sh,并把源与生成物一并提交(禁止手改生成物)。"
            exit 1
          fi

      - name: Doc index consistency (docs/index.md must exist)
        run: test -f docs/index.md

      - name: Slogan guard (forbidden slogan must not appear)
        run: |
          # 禁用口号守卫:裸用拦截;警示性提及(含 禁用/严禁/不使用/DeepSeek/占用 字样)豁免。
          # 目录豁免: .etherkit(规则源)/spec(方针记录)/experience-library(教训记录)。
          hits=$(grep -rn "一切皆插件" --include="*.md" \
                   --exclude-dir=.etherkit --exclude-dir=spec --exclude-dir=experience-library . \
                 | grep -vE "禁用|严禁|不使用|DeepSeek|占用" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::检测到禁用口号裸用(DeepSeek Harness 已占用)。请使用「融汇万端 / Connect the Unconnectable.」;警示性提及须带 禁用/严禁/不使用 等字样。"
            exit 1
          fi

      - name: M0 empty build (skeleton check)
        run: make

  build:
    name: build ToaruOS base (submodules recursive)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies (per docs/reports/2026-10-06-toaruos-survey.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 xorriso genext2fs mtools gnu-efi git \
            automake autoconf wget libgmp-dev libmpfr-dev libmpc-dev \
            flex bison texinfo dosfstools

      - name: Build base OS
        run: |
          cd base/toaruos
          bash util/build-toolchain.sh
          make util/local/bin/kuroko
          make -j4

      - name: Collect boot artifacts
        run: |
          mkdir -p artifacts
          find base/toaruos -maxdepth 2 -type f \( -name "*.iso" -o -name "misaka-kernel" -o -name "*.igz" \) -exec cp {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etheros-boot-artifacts
          path: artifacts/
          if-no-files-found: warn
