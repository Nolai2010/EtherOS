# EtherOS 内核边界声明（唯一不可插件化的部分）
# 规则:本清单之外的一切"系统能力"必须以插件形式存在于 plugins/。
# 本文件改动视同架构级变更,必须走 spec 修订 + 独立 review。

[system]
name = "EtherOS"
slogan = "Connect the Unconnectable."          # 融汇万端
tagline = "Plugin-Native. Kernel-Minimal."
forbidden_slogan = "一切皆插件"                 # DeepSeek Harness 已占用,严禁使用

[kernel]
# 内核仅拥有以下三项能力(零格式知识):
capabilities = [
    "schedule",         # 进程/线程调度
    "protocol-route",   # 协议/能力解释与路由(读 plugin manifest,把请求导向拥有该能力的插件)
    "load-isolate",     # 插件加载与隔离域管理
]
# 禁止进入内核的任何逻辑:
forbidden_in_kernel = [
    "fs-format",        # 文件系统格式
    "app-format",       # 应用格式(ipa/exe/apk...)
    "device-protocol",  # 设备协议逻辑
    "ui",               # 界面
    "driver",           # 驱动(驱动也是插件)
]

[shipped_plugins]
# 内建不可卸载插件(本质仍是插件,位置 plugins/builtin/):
uninstallable = false
# 成员示例: shell / window-manager / file-manager / settings / perf-monitor / drivers / services

[optional_plugins]
# 可选可替换插件(位置 plugins/optional/):
uninstallable = true
