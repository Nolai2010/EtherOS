# config/default.toml —— EtherOS 运行期默认配置(M2:插件启用段已生效)
# 集中化、单目录、随仓库迁移;镜像内 /etc/os/config.toml 可覆盖本文件。
# [plugins] 为插件启用唯一事实源(铁律 12),M2 于校验期生效:由 tools/validate_plugins.py
# 强制与插件树一致(非法 id/不可卸载项即红,见 M2-04)。运行期按 enabled 装载属 M3。
# [system]/[shell]/[compat] 仍仅声明结构,运行期生效逻辑随 M3+ 落地。

[system]
name = "EtherOS"
stage = "M2-plugins"

[shell]
# shell 是内建插件(plugins/builtin/),此处仅配置其容器策略偏好
default_container = "windowed"   # desktop: windowed | mobile: fullscreen|split

[compat]
# 兼容运行时开关(M3 起生效)
enabled = false
allow_formats = []               # M3 桩: 本地格式白名单,如 ["demo-script"]

[plugins]
# 插件启用唯一事实源(铁律 12)。builtin/dev 隐式启用;此处管理 optional:
enabled = ["hello-plugin", "douyin"]
